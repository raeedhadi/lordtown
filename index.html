<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORD TOWN | الحفرة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(20, 20, 20, 0.8);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            max-width: 400px;
            width: 90%;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #555;
            margin-bottom: 20px;
            object-fit: cover;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            background-color: #1a1a1a;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid #444;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #333;
            border-color: #fff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- صورة الشعار أو الرمزية -->
        <img src="https://i.imgur.com/34XpT9j.png" alt="Logo" class="avatar">
        
        <h1>لـورد تـاون | الحفرة</h1>
        <p>إمبراطورية الممنوعات وعالم المافيا السرية</p>
        
        <div class="links">
            <a href="رابط-ديسكوردك-هنا" target="_blank" class="btn">Discord Server 🛡️</a>
            <a href="#" class="btn">السوق السوداء 🌿</a>
            <a href="#" class="btn">قناة التليجرام 📡</a>
        </div>
    </div>

</body>
</html>
