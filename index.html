<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LorD TowN - الموقع الرسمي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hero">
        <div class="logo-container">
            <h2>LorD TowN</h2>
            <p>السيرفر الأقوى والأفضل لتجربة مميزة</p>
        </div>

        <div class="status-card">
            <h3>حالة بوت السيرفر 🤖</h3>
            <div class="status-row">
                <span>حالة الاتصال:</span>
                <span id="bot-status" class="offline">جاري الاتصال...</span>
            </div>
            <div class="status-row">
                <span>اسم البوت:</span>
                <span id="bot-name">-</span>
            </div>
            <div class="status-row">
                <span>سرعة الاستجابة (Ping):</span>
                <span id="bot-ping">-</span>
            </div>
            <div class="status-row">
                <span>عدد السيرفرات:</span>
                <span id="bot-guilds">-</span>
            </div>
        </div>

        <div class="buttons">
            <a href="https://discord.gg/your-invite-link" target="_blank" class="btn discord-btn">انضم للسيرفر</a>
        </div>
    </div>

    <footer>
        <p>© LorD TowN Management. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
